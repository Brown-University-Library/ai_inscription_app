name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      HAS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra build

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"(.+?)"').Matches[0].Groups[1].Value
          # Pad to 4-part version for Windows (e.g., "0.1.0" -> "0.1.0.0")
          $parts = $version.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $winVersion = $parts -join '.'
          echo "VERSION=$winVersion" >> $env:GITHUB_OUTPUT

      - name: Build with Nuitka
        run: |
          uv run python -m nuitka `
            --onefile `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --output-filename=LeidenToEpiDoc.exe `
            --company-name="Brown University Library" `
            --product-name="Leiden to EpiDoc Converter" `
            --file-description="Converts Leiden Convention inscriptions to EpiDoc XML" `
            --file-version="${{ steps.version.outputs.VERSION }}" `
            --product-version="${{ steps.version.outputs.VERSION }}" `
            --copyright="Brown University Library" `
            leiden-epidoc.py

      - name: Sign executable
        if: env.HAS_SIGN_CERT == 'true'
        env:
          WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT)
          $certPath = Join-Path $env:RUNNER_TEMP "code_sign_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          & signtool sign /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            LeidenToEpiDoc.exe

          Remove-Item $certPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeidenToEpiDoc-Windows
          path: LeidenToEpiDoc.exe
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LeidenToEpiDoc.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
